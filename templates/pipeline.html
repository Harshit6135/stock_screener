{% extends "base.html" %}{% block title %}Pipeline · Stock Screener{% endblock %}{% block content %}<div class="page-heading"><div><h1>Research pipeline</h1><p class="muted">Manual orchestration only. Stage state comes from the durable pipeline record.</p></div></div><section class="card"><div class="toolbar"><div class="field"><label>Start</label><input id="start" type="date" value="{{ default_start }}"></div><div class="field"><label>End</label><input id="end" type="date" value="{{ default_end }}"></div><label><input id="data" type="checkbox" checked> Orchestrate data</label><button id="submit-pipeline">Submit</button></div><div class="toolbar"><input id="pipeline-id" placeholder="Pipeline ID"><button id="load-pipeline" class="secondary">Load</button><button id="cancel-pipeline" class="danger" disabled>Cancel</button></div><p id="pipeline-error" class="error" role="alert"></p></section><section class="card"><h2>Stages</h2><div class="table-wrap"><table><thead><tr><th>Stage</th><th>Status</th><th>Job</th><th>Action</th></tr></thead><tbody id="stages"></tbody></table></div></section><section class="card"><h2>Worker</h2><div class="toolbar"><button data-worker="start">Start</button><button data-worker="work-once" class="secondary">Work once</button><button data-worker="stop" class="danger">Stop</button><button id="worker-status" class="secondary">Refresh status</button></div><pre id="worker"></pre></section>{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='js/pipeline.js') }}"></script>{% endblock %}
