<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screener · Layout preview</title><link rel="stylesheet" href="demo.css"><link rel="stylesheet" href="workflows.css?v=4"><link rel="stylesheet" href="portfolio-live.css?v=5">
<style>
.sidebar{background:#142d36;border-color:#142d36}.sidebar .brand{color:#fff!important}.sidebar nav a{color:#a6bdc5}.sidebar nav a[aria-current=page]{color:#93e4cc;background:#24454d;border-color:#365b62}.sidebar-footer,.sidebar-footer a,.sidebar-footer small,.workspace-label{color:#b4c6cd}.sidebar-footer{border-color:#35515b}.demo-label{background:#e6f3ee;color:#24745d;padding:4px 10px;border-radius:5px;font-size:10px;font-weight:650;letter-spacing:.4px}.heading-actions{display:flex;gap:10px}.hero-value{font-size:30px}.delta{font-size:11px;margin-top:8px}.subtle{color:var(--muted);font-size:11px}.chart-layout{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(230px,1fr);gap:18px;margin:20px 0}.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.periods{display:flex;gap:4px}.periods button{min-height:27px;padding:4px 9px;font-size:10px;background:var(--surface-2);color:var(--muted)}.periods button.active{background:var(--accent);color:var(--accent-ink)}.chart{height:235px;width:100%;overflow:visible}.chart text{font-family:inherit;font-size:10px;fill:var(--muted)}.allocation{display:flex;align-items:center;gap:22px;margin:24px 0}.donut{width:108px;height:108px;border-radius:50%;background:conic-gradient(#147d64 0 34%,#5ba992 34% 58%,#a9d1c1 58% 81%,#dce8e1 81% 100%);position:relative;flex-shrink:0}.donut:after{content:'8 stocks';position:absolute;inset:17px;display:grid;place-items:center;background:var(--surface);border-radius:50%;font-size:12px;font-weight:650}.legend{display:grid;gap:10px;font-size:11px}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:7px;height:7px;border-radius:2px}.risk-banner{border:1px solid #ebd6ae;background:#fff9ee;border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;color:#77561d;font-size:12px}.risk-banner button{min-height:30px;color:#77561d;border-color:#ebd6ae;background:transparent;font-size:11px}.num{text-align:right;white-space:nowrap}.stock-name{display:block;font-size:10px;color:var(--muted);font-weight:400;margin-top:3px}.badge{display:inline-block;font-size:10px;padding:3px 8px;border-radius:5px;background:#e9f4ee;color:#2b785c;white-space:nowrap}.badge.warn{background:#fff0d5;color:#946824}.table-footer{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding-top:14px}.demo-note{margin:24px 0 0;color:var(--muted);font-size:11px}.detail-line{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0;font-size:12px}.detail-line strong{font-weight:600}.steps{display:flex;gap:10px;margin:20px 0 25px}.step{flex:1;border-top:3px solid var(--line);padding-top:9px;color:var(--muted);font-size:11px}.step.current{border-color:var(--accent);color:var(--accent)}.import-option{display:block;padding:18px;border:1px solid var(--line);border-radius:9px;margin:12px 0;cursor:pointer}.import-option:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 4%,var(--surface))}.import-option strong{margin-left:8px;font-size:13px}.import-option p{margin:7px 0 0 25px;color:var(--muted);font-size:12px}.modal-actions{display:flex;justify-content:space-between;margin-top:24px}.file-box{border:1px dashed var(--line);padding:22px;border-radius:9px}.section-tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:20px}.section-tabs button{background:transparent;color:var(--muted);border-radius:0;border-bottom:2px solid transparent;padding:10px 0}.section-tabs button.active{color:var(--accent);border-color:var(--accent)}.rank-number{font-size:17px;font-weight:650;color:var(--accent)}.stage{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:18px 0}.stage:last-child{border-bottom:0}.stage small{display:block;color:var(--muted);font-size:11px;margin-top:4px}.progress-bar{height:6px;background:var(--surface-2);border-radius:4px;margin:16px 0}.progress-bar span{display:block;width:66%;height:100%;background:var(--accent);border-radius:4px}.demo-body{min-height:50vh}.muted-link{color:var(--muted);font-size:12px}.hero-metric{display:flex;justify-content:space-between;align-items:center}.empty-icon{font-size:30px;color:var(--accent);margin-bottom:12px}
@media(max-width:1000px){.chart-layout{grid-template-columns:1fr}.allocation{margin:12px 0}.chart{height:210px}}@media(max-width:800px){.heading-actions{flex-wrap:wrap}.risk-banner{align-items:start}.page-heading{gap:15px}.table-footer{gap:10px}.topbar .demo-label{display:none}}html[data-theme=dark] .risk-banner{background:#332b1d;border-color:#5e4d2c;color:#e6bf78}html[data-theme=dark] .badge{background:#244438;color:#a0dcc5}html[data-theme=dark] .badge.warn{background:#40341f;color:#e6bf78}
</style></head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<aside class="sidebar" aria-label="Primary navigation"><a class="brand" href="#portfolio"><span class="brand-mark">S</span><span>Screener<small>MARKET WORKSPACE</small></span></a><nav id="navigation"></nav><div class="sidebar-footer"><span class="workspace-label">NSE EQUITIES</span><small>Research · Review · Track</small><span class="demo-label">DESIGN PREVIEW</span></div></aside>
<div class="app-shell"><header class="topbar"><span class="topbar-context">Your investment workspace</span><div class="topbar-tools"><span class="demo-label">SAMPLE DATA · NO LIVE ACTIONS</span><span id="page-status" role="status" aria-live="polite">Layout preview</span><button id="theme" class="icon-button secondary" aria-label="Switch color theme">◐</button></div></header><main id="main-content"><div id="page"></div><p class="demo-note">Interactive design demo. All values are illustrative. Imports and trading actions are simulated.</p></main></div>
<dialog id="import-modal" aria-labelledby="import-title"><div id="import-content"></div></dialog>
<dialog id="detail-modal" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
<script>
const $=id=>document.getElementById(id);
const pages=[['portfolio','Portfolio','▦'],['actions','Trade review','✓'],['pipeline','Research runs','↗'],['rankings','Stock rankings','≡'],['universe','Stock universe','◎'],['backtest','Backtests','◷'],['settings','Settings','⚙'],['logs','Activity & quality','≋'],['guide','Guide','?']];
$('navigation').innerHTML=pages.map(([key,title,icon])=>`<a href="#${key}" data-page="${key}"><span class="nav-icon" aria-hidden="true">${icon}</span>${title}</a>`).join('');
const stocks=[['RELIANCE','Reliance Industries',40,'₹2,710.00','₹1,08,400','+₹8,400','+8.40%','Within stop'],['HDFCBANK','HDFC Bank',55,'₹1,685.00','₹92,675','+₹4,125','+4.66%','Within stop'],['INFY','Infosys',35,'₹1,520.00','₹53,200','−₹2,800','−5.00%','Review stop'],['BHARTIARTL','Bharti Airtel',30,'₹1,735.00','₹52,050','+₹6,450','+14.14%','Within stop']];
function heading(kicker,title,copy,actions=''){return `<div class="page-heading"><div><div class="workflow-kicker">${kicker}</div><h1>${title}</h1><p class="muted">${copy}</p></div><div class="heading-actions">${actions}</div></div>`}
function chart(){return `<svg class="chart" viewBox="0 0 650 230" role="img" aria-label="Illustrative portfolio value rises from 4.1 lakh in April to 4.82 lakh in October"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#147d64" stop-opacity=".16"/><stop offset="1" stop-color="#147d64" stop-opacity="0"/></linearGradient></defs><g stroke="var(--line)" stroke-dasharray="3 5"><path d="M55 30H630 M55 75H630 M55 120H630 M55 165H630"/></g><text x="0" y="34">₹5.0L</text><text x="0" y="79">₹4.7L</text><text x="0" y="124">₹4.4L</text><text x="0" y="169">₹4.1L</text><path d="M55 164L80 152L102 156L128 142L151 149L174 122L197 125L222 114L244 130L266 106L290 111L315 98L336 112L358 85L382 90L406 72L432 77L458 56L483 68L508 48L533 56L558 35L582 47L606 31L630 37V185H55Z" fill="url(#area)"/><path d="M55 164L80 152L102 156L128 142L151 149L174 122L197 125L222 114L244 130L266 106L290 111L315 98L336 112L358 85L382 90L406 72L432 77L458 56L483 68L508 48L533 56L558 35L582 47L606 31L630 37" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="630" cy="37" r="4" fill="var(--accent)"/><text x="55" y="213">Apr</text><text x="151" y="213">May</text><text x="244" y="213">Jun</text><text x="336" y="213">Jul</text><text x="432" y="213">Aug</text><text x="533" y="213">Sep</text><text x="614" y="213">Oct</text></svg>`}
function metrics(items){return `<section class="grid portfolio-metrics">${items.map(([label,value,foot])=>`<article class="card"><div class="metric-label">${label}</div><div class="metric hero-value">${value}</div><div class="delta subtle">${foot}</div></article>`).join('')}</section>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function portfolio(){return heading('PORTFOLIO OVERVIEW','A clearer view of your portfolio','Track performance, review your holdings, and stay on top of risk.',`<button class="secondary" data-import>Import portfolio</button><button data-account>+ Add account</button>`)+`<div class="toolbar"><div class="field"><label for="demo-account">Account</label><select id="demo-account"><option>My long-term portfolio</option><option>Momentum portfolio</option></select></div><div class="field"><label for="demo-date">Valuation date</label><input id="demo-date" type="date" value="2026-10-05"></div><span class="subtle">● Closing prices · 5 Oct 2026</span><button class="secondary" data-refresh>Refresh</button></div>`+metrics([['Portfolio value','₹4,82,650','Holdings + available cash'],['Unrealised gain','<span class="positive">+₹38,420</span>','<span class="positive">+9.31%</span> on open holdings'],["Day’s change",'<span class="positive">+₹2,180</span>','<span class="positive">+0.45%</span> vs previous close'],['Available cash','₹31,980','6.6% of portfolio']])+`<div class="risk-banner"><span><strong>1 holding needs a stop review</strong> &nbsp; INFY closed below its trailing stop.</span><button data-nav="actions">Review alert →</button></div><section class="chart-layout"><article class="card"><div class="chart-header"><div><h2>Portfolio performance</h2><span class="subtle">Value over time · including cash</span></div><div class="periods"><button class="active">6M</button></div></div>${chart()}</article><article class="card"><h2>Where your capital sits</h2><div class="allocation"><div class="donut" role="img" aria-label="Illustrative sector allocation"></div><div class="legend"><span><i style="background:#147d64"></i>Financials · 34%</span><span><i style="background:#5ba992"></i>Technology · 24%</span><span><i style="background:#a9d1c1"></i>Energy · 23%</span><span><i style="background:#dce8e1"></i>Other · 19%</span></div></div><div class="detail-line"><span>Risk to stops</span><strong>₹12,450 · 2.6%</strong></div><div class="detail-line"><span>Largest holding</span><strong>RELIANCE · 22.5%</strong></div><button class="secondary" data-risk>View risk details</button></article></section><section class="card"><div class="workflow-section-title"><div><h2>Your holdings <span class="subtle">8 positions</span></h2></div><label class="ranking-search"><span>Find a holding</span><input id="holding-search" type="search" placeholder="Search stock…"></label></div>${table(['Stock','Units','Close price','Market value','Unrealised P&L','Stop status',''],stocks.map((s,i)=>[`<strong>${s[0]}</strong><span class="stock-name">${s[1]}</span>`,s[2],s[3],s[4],`<span class="${i===2?'negative':'positive'}">${s[5]}<span class="stock-name">${s[6]}</span></span>`,`<span class="badge ${i===2?'warn':''}">${s[7]}</span>`,`<button class="secondary" data-stock="${i}">Details</button>`]))}<div class="table-footer"><span>Showing 4 of 8 illustrative holdings</span><button class="secondary" data-history>View trade journal</button></div></section><details class="card section-space"><summary>More performance metrics</summary><div class="grid three portfolio-detail-metrics"><div><div class="metric-label">Invested capital</div><div class="metric">₹4,12,250</div></div><div><div class="metric-label">Realised gain</div><div class="metric positive">₹18,950</div></div><div><div class="metric-label">Account XIRR <span title="Annualised return using dated deposits and withdrawals">ⓘ</span></div><div class="metric">14.2%</div></div></div></details>`}
function actions(){return heading('TRADE REVIEW','Decide what happens next','Review proposed trades and stop alerts before approving an action.')+`<div class="toolbar"><div class="field"><label for="action-account">Portfolio</label><select id="action-account"><option>My long-term portfolio</option></select></div><button data-generate>Generate proposals</button></div><div class="section-tabs"><button class="active">Needs review · 3</button></div><section class="card"><div class="workflow-section-title"><div><h2>Review queue</h2><p class="muted">The reason, risk, and next action stay together.</p></div></div>${table(['Stock / action','Why this is proposed','Estimated impact','Next step'],[['INFY <span class="badge warn">Stop alert</span>','Closed below trailing stop of ₹1,535','Sell 35 shares · ₹53,200', '<button data-review="INFY">Review sell</button>'],['BHARTIARTL <span class="badge">Buy</span>','Momentum rank #3 · quality score 82','₹17,350 · 3.6% of equity','<button class="secondary" data-review="BHARTIARTL">Review buy</button>'],['HDFCBANK <span class="badge">Add</span>','Trend strength improved · ADX 29','₹16,850 · 3.5% of equity','<button class="secondary" data-review="HDFCBANK">Review addition</button>']])}</section>`}
function pipeline(){return heading('RESEARCH','Prepare your next screening session','Choose a date range, run research, then review the resulting stock rankings.')+`<section class="grid two"><article class="card"><h2>Start a research run</h2><div class="toolbar"><div class="field"><label for="research-start">From</label><input id="research-start" type="date" value="2026-09-28"></div><div class="field"><label for="research-end">To</label><input id="research-end" type="date" value="2026-10-05"></div></div><label class="workflow-check"><input type="checkbox" checked><span>Refresh market data before research</span></label><button data-run>Start research</button></article><article class="card"><h2>Latest run</h2><span class="badge">Sample run · 2 of 3 steps complete</span><div class="progress-bar"><span></span></div><div class="stage"><div>Market data<small>Sessions prepared</small></div><span class="positive">Complete</span></div><div class="stage"><div>Indicators<small>Stock factors calculated</small></div><span class="positive">Complete</span></div><div class="stage"><div>Strategy rankings<small>Calculating results</small></div><span class="muted">Running</span></div></article></section><aside class="next-step"><div><strong>Explore published results</strong><p>Choose a strategy and session on stock rankings.</p></div><button class="secondary" data-nav="rankings">View rankings →</button></aside><details class="card"><summary>Worker controls &amp; run diagnostics</summary><p class="muted">Advanced operational details appear here when needed, rather than above the main workflow.</p></details>`}
function rankings(){return heading('STOCK RESEARCH','Find your strongest candidates','Compare the top stocks for a strategy, then take them into trade review.')+`<section class="card"><div class="toolbar"><div class="field"><label for="ranking-strategy">Strategy</label><select id="ranking-strategy"><option>Momentum Quality</option><option>Positional Trend</option></select></div><div class="field"><label for="ranking-session">Session</label><input id="ranking-session" type="date" value="2026-10-05"></div><button data-load>Load rankings</button></div>${table(['Rank','Stock','Score','Trend','Next step'],[['<span class="rank-number">01</span>','RELIANCE','89.4','<span class="badge">Strong</span>','<button class="secondary" data-review="RELIANCE">Inspect</button>'],['<span class="rank-number">02</span>','HDFCBANK','85.1','<span class="badge">Strong</span>','<button class="secondary" data-review="HDFCBANK">Inspect</button>'],['<span class="rank-number">03</span>','BHARTIARTL','82.0','<span class="badge">Improving</span>','<button class="secondary" data-review="BHARTIARTL">Inspect</button>']])}</section><aside class="next-step"><div><strong>Turn research into a reviewable proposal</strong><p>Check share sizing and account risk before execution.</p></div><button class="secondary" data-nav="actions">Open trade review →</button></aside>`}
function universe(){return heading('STOCK UNIVERSE','Know what you’re screening','Browse eligible stocks and see how the universe changed between sessions.', '<button data-refresh>Refresh universe</button>')+metrics([['Eligible stocks','500','Latest sample snapshot'],['Snapshot date','5 Oct','2026'],['Added','12','Compared with previous snapshot'],['Removed','8','Compared with previous snapshot']])+`<section class="card"><h2>Current members</h2>${table(['Stock','Company','Sector','Coverage'],stocks.map(s=>[s[0],s[1],s[0]==='INFY'?'Technology':'Large-cap equities','<span class="badge">Available</span>']))}</section><details class="card section-space"><summary>Compare snapshots &amp; view history</summary><p class="muted">A readable list of additions and removals replaces raw JSON output.</p><div class="comparison-symbols"><span class="badge">Added · SAMPLE-A</span><span class="badge warn">Removed · SAMPLE-B</span></div></details>`}
function backtest(){return heading('STRATEGY TESTING','Test before you commit','Simulate a strategy over a past period, then inspect its returns, drawdown, and trades.')+`<section class="card"><h2>Simulation setup</h2><div class="toolbar"><div class="field"><label for="test-strategy">Strategy</label><select id="test-strategy"><option>Momentum Quality</option></select></div><div class="field"><label for="test-start">From</label><input id="test-start" type="date" value="2023-10-05"></div><div class="field"><label for="test-end">To</label><input id="test-end" type="date" value="2026-10-05"></div><div class="field"><label for="test-capital">Starting capital (₹)</label><input id="test-capital" type="number" value="200000"></div><button data-simulate>Run simulation</button></div><details><summary>Costs, stop rules &amp; execution assumptions</summary><p class="muted">Advanced options are kept within simulation setup.</p></details></section><div class="section-space">${metrics([['Total return','+42.8%','Illustrative historical result'],['Annualised return','12.6%','CAGR'],['Max drawdown','−14.2%','Largest decline from peak'],['Closed trades','86','Across the selected period']])}</div><section class="card"><div class="chart-header"><h2>Simulation equity curve</h2><span class="subtle">Sample completed report</span></div>${chart()}<details><summary>Trade log &amp; annual returns</summary><p class="muted">Detailed tables sit underneath the performance overview.</p></details></section>`}
function settings(){return heading('WORKSPACE SETTINGS','Keep your rules easy to understand','Manage portfolio limits and inspect the strategy configuration.')+`<section class="grid two"><article class="card"><h2>Portfolio risk limits</h2><div class="settings-fields"><div class="field"><label for="limit">Maximum portfolio risk (%)</label><input id="limit" type="number" value="6"><small>Combined risk from open positions to their stops.</small></div><div class="field"><label for="position-limit">Maximum position size (%)</label><input id="position-limit" type="number" value="10"></div></div><button data-save>Save demo limits</button><details><summary>Advanced configuration</summary><p class="muted">Version and raw configuration remain available here.</p></details></article><article class="card"><h2>Active strategies</h2><div class="detail-line"><span>Momentum Quality</span><span class="badge">Active</span></div><div class="detail-line"><span>Positional Trend</span><span class="badge">Active</span></div><p class="muted">Select a strategy to inspect its rules and revision history.</p><button class="secondary" data-nav="guide">Understand strategy rules</button></article></section>`}
function logs(){return heading('ACTIVITY & DATA QUALITY','Find what needs attention','Review failures and missing data, with a clear route to the next step.')+`<section class="card"><div class="toolbar"><div class="field"><label for="log-severity">Severity</label><select id="log-severity"><option>All events</option><option>Warnings</option><option>Errors</option></select></div><button data-load>Apply filters</button></div>${table(['Observed','Severity','Issue','Next step'],[['5 Oct · 18:30','<span class="badge warn">Warning</span>','Historical prices missing for 2 stocks','<button class="secondary" data-nav="pipeline">Prepare data</button>'],['5 Oct · 18:20','<span class="badge">Complete</span>','Market data refreshed','No action needed']])}</section>`}
function guide(){return heading('WORKSPACE GUIDE','What would you like to do?','Start with a task. Open deeper explanations when you need them.')+`<section class="grid two">${[['Track a portfolio','Import holdings, review performance, and inspect stop risk.','portfolio'],['Find potential trades','Prepare research, compare rankings, then review proposals.','rankings'],['Test a strategy','Choose a historical period and evaluate simulated performance.','backtest'],['Fix missing data','Use quality events to identify and retry data preparation.','logs']].map(([t,c,k])=>`<article class="card"><h2>${t}</h2><p class="muted">${c}</p><button class="secondary" data-nav="${k}">Open workflow →</button></article>`).join('')}</section>`}
const renderers={portfolio,actions,pipeline,rankings,universe,backtest,settings,logs,guide};
function render(){const key=location.hash.slice(1).split('/')[0]||'portfolio';$('page').innerHTML=(renderers[key]||portfolio)();document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});$('page-status').textContent='Layout preview';}
window.addEventListener('hashchange',render);render();
$('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
let importStep=1,importType='tradebook';
function openImport(step=1){importStep=step;const body=step===1?`<p class="muted">Choose how to bring holdings into this portfolio.</p><label class="import-option"><input name="source" type="radio" value="tradebook" checked><strong>Tradebook history</strong><p>Import buys and sells, including closed trades and purchase dates.</p></label><label class="import-option"><input name="source" type="radio" value="holdings"><strong>Current Kite holdings</strong><p>Start with current quantities and average costs.</p></label>`:step===2?`<h3>${importType==='tradebook'?'Choose your tradebook':'Connect and select holdings'}</h3><div class="notice">${importType==='tradebook'?'Use the full Equity tradebook from Zerodha Console. Including closed trades helps reconstruct realised gains and return history.':'Current holdings do not include past sales. Add purchase dates to calculate holding returns; import full history later for realised gains.'}</div><div class="file-box section-space"><strong>${importType==='tradebook'?'Sample file: equity-tradebook.csv':'Sample connection: Kite portfolio'}</strong><p class="muted">This preview uses sample records. No file is uploaded and no broker connection is made.</p></div>`:step===3?`<h3>Review before importing</h3>${table(['Included','Records'],[['Stocks','8'],['Buys and sells','42'],['Closed trades','12']])}<div class="notice section-space">Importing records updates portfolio accounting. Review duplicates and funding history here before applying.</div>`:`<div class="empty-state"><div class="empty-icon">✓</div><h3>Demo import complete</h3><p>Your dashboard stays focused on holdings and performance. Import guidance closes with this flow.</p></div>`;
$('import-content').innerHTML=`<h2 id="import-title">Import portfolio</h2>${step<4?`<div class="steps"><span class="step ${step===1?'current':''}">1 · Source</span><span class="step ${step===2?'current':''}">2 · Prepare</span><span class="step ${step===3?'current':''}">3 · Review</span></div>`:''}${body}<div class="modal-actions"><button class="secondary" data-close-import>${step===4?'Close':'Cancel'}</button>${step<4?`<button data-import-next>${step===3?'Simulate import':'Continue →'}</button>`:''}</div>`;if(!$('import-modal').open)$('import-modal').showModal();}
function detail(title,body){$('detail-content').innerHTML=`<h2 id="detail-title">${title}</h2>${body}<button class="secondary" data-close-detail>Close</button>`;$('detail-modal').showModal();}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)location.hash=b.dataset.nav;if(b.hasAttribute('data-import'))openImport();if(b.hasAttribute('data-import-next')){if(importStep===1)importType=document.querySelector('input[name=source]:checked').value;openImport(importStep+1)}if(b.hasAttribute('data-close-import'))$('import-modal').close();if(b.hasAttribute('data-close-detail'))$('detail-modal').close();if(b.dataset.stock){const s=stocks[Number(b.dataset.stock)];detail(s[0]+' · Position details',`<p class="muted">${s[1]}</p><div class="detail-line"><span>Units</span><strong>${s[2]}</strong></div><div class="detail-line"><span>Market value</span><strong>${s[4]}</strong></div><div class="detail-line"><span>Stop status</span><strong>${s[7]}</strong></div><p class="muted">Acquisition dates, stop thresholds, and pricing evidence belong in this detail view.</p>`)}if(b.dataset.review)detail('Review '+b.dataset.review,`<p class="muted">The real review view would show the rationale, units, estimated price, stop risk, and account impact together.</p><div class="notice">This is a layout preview. No order can be approved or submitted here.</div>`);if(b.hasAttribute('data-risk'))detail('Portfolio risk','<div class="detail-line"><span>Risk to stops</span><strong>₹12,450 · 2.6%</strong></div><div class="detail-line"><span>Holding below trailing stop</span><strong>INFY</strong></div><p class="muted">Expand a position to inspect its stop basis and pricing date.</p>');if(b.hasAttribute('data-history'))detail('Closed trade journal',table(['Stock','Sell date','Realised gain'],[['TCS','18 Sep 2026','₹6,250'],['ITC','24 Sep 2026','₹3,180']]));if(b.hasAttribute('data-account'))detail('Add a portfolio','<div class="field"><label for="new-name">Portfolio name</label><input id="new-name" placeholder="e.g. Long-term investments"></div><p class="muted">Account setup continues to opening balance and date in the full app.</p>');if(['refresh','generate','run','load','simulate','save'].some(k=>b.hasAttribute('data-'+k)))$('page-status').textContent='Demo only · no app data changed';});
document.addEventListener('input',e=>{if(e.target.id==='holding-search'){const query=e.target.value.toLowerCase();document.querySelectorAll('#page tbody tr').forEach(r=>r.hidden=!r.cells[0].textContent.toLowerCase().includes(query));}});
