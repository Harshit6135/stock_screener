name: backend-ci

on:
  push:
  pull_request:

jobs:
  verify:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install poetry==2.4.3
      - run: poetry check --lock
      - run: poetry install --with dev
      - run: poetry run python -m pytest tests --cov=src --cov=run --cov-fail-under=85 -q
      - run: python -m compileall -q src run.py
      - run: poetry run ruff format --check src tests run.py
      - run: poetry run ruff check src tests run.py
      - run: poetry run mypy src run.py
      - run: poetry run bandit -q -r src run.py
      - run: poetry run python -m pip check
      - run: poetry build
