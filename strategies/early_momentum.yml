schema_version: 1
strategy:
  id: strategy3
  name: NSE Early Momentum Event Study
  version: 1.0.0
  description: Isolated daily early-momentum signal research; not a portfolio strategy.

data_dependencies:
  benchmark: NIFTY 500

calculation:
  instrument_implementation: custom.early_momentum_features
  required_sessions: 317

factors:
  residual_momentum: 1.0

portfolio_policy:
  initial_capital: 100000
  max_positions: 15
  exit_threshold: 0
  buffer_percent: 0
  max_concentration_pct: 0.25

ranking:
  frequency: daily
  session: each_trading_session
  aggregation: daily_signal
  tie_policy: residual_score_desc_symbol_asc
