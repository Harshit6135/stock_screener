[project]
name = "stock-screener"
version = "3.0.0"
description = "Multi-factor momentum screening and portfolio management for NSE/BSE stocks"
authors = [
    {name = "Yash Bhargava", email = "yashbhargava.code@gmail.com"},
    {name = "Harshit Garg", email = "harshitgarg.0196@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "kiteconnect>=5.2.1,<6",
    "flask>=3.1.3,<3.2",
    "pandas>=2.2.3,<3",
    "pandas-ta>=0.4.71b0,<0.5",
    "PyYAML>=6.0,<7",
    "waitress>=3.0.2,<3.1",
    "typing-extensions>=4.16,<5",
    "yfinance>=0.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-cov>=7.0,<8",
    "black>=26.0,<27",
    "isort>=7.0,<10",
    "flake8>=7.0,<8",
    "ruff>=0.16.7,<0.17",
    "mypy>=1.20,<2",
    "bandit>=1.9,<2",
]

[project.scripts]
screener = "run:main"
screener-ops = "src.application.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "src"}]
include = [{path = "run.py", format = ["sdist", "wheel"]}]

[tool.poetry.group.dev.dependencies]
bandit = ">=1.9,<2"
black = ">=26.0,<27"
flake8 = ">=7.0,<8"
isort = ">=7.0,<10"
mypy = ">=1.20,<2"
pytest = ">=9.0,<10"
pytest-cov = ">=7.0,<8"
ruff = ">=0.16.7,<0.17"

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | migrations
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
exclude = [
    ".git",
    ".venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.lint]
ignore = ["E402", "F403"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", "migrations"]
